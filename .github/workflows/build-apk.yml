name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar paquetes del Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Instalar dependencias
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Generar proyecto nativo Android
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: '1'
          CI: '1'
        run: npx expo prebuild --platform android --clean --non-interactive

      # Los build de debug omiten el bundle JS y solo sirven con Metro encendido.
      # Al forzarlo, el APK se puede instalar y usar directamente en el celular.
      - name: Incluir el bundle JS en el APK
        run: echo "react { debuggableVariants = [] }" >> mobile/android/app/build.gradle

      - name: Compilar APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          mv mobile/android/app/build/outputs/apk/debug/app-debug.apk PYSTON-HYDRA-debug.apk
          ls -lh PYSTON-HYDRA-debug.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: pyston-hydra-apk
          path: PYSTON-HYDRA-debug.apk
          retention-days: 30