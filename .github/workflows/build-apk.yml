name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencias
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Generar proyecto nativo Android
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: '1'
          CI: '1'
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Compilar APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk PYSTON-HYDRA-debug.apk
          ls -lh PYSTON-HYDRA-debug.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: pyston-hydra-apk
          path: PYSTON-HYDRA-debug.apk
          retention-days: 30